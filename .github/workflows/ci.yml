name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detection)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Enforce minimum coverage
        run: |
          # Check per-package minimums
          check_coverage() {
            local pkg=$1
            local min=$2
            local cov
            cov=$(go test -coverprofile=/dev/null "./$pkg" 2>&1 | grep -oP '\d+\.\d+(?=%)' || echo "0")
            if (( $(echo "$cov < $min" | bc -l) )); then
              echo "FAIL: $pkg coverage is ${cov}% (minimum: ${min}%)"
              return 1
            else
              echo "OK:   $pkg coverage is ${cov}% (minimum: ${min}%)"
              return 0
            fi
          }

          FAILED=0
          check_coverage "internal/syncer" 80 || FAILED=1
          check_coverage "internal/config" 85 || FAILED=1
          check_coverage "internal/db"     75 || FAILED=1
          exit $FAILED

      - name: Cross-compile (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/satsbook

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t satsbook:ci-test .

      - name: Smoke test — container starts and serves HTTP
        run: |
          DATA_DIR="$(mktemp -d)"
          mkdir -p "$DATA_DIR/data"

          # Start container in background
          docker run -d --name satsbook-smoke \
            -p 3000:3000 \
            -v "$DATA_DIR/data:/data" \
            -e SATSBOOK_DATABASE_PATH=/data/satsbook.db \
            -e SATSBOOK_APP_PORT=3000 \
            satsbook:ci-test

          # Wait for HTTP to be ready (up to 15s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "OK: HTTP responding after ${i}s"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "FAIL: container did not respond within 15s"
              docker logs satsbook-smoke
              exit 1
            fi
            sleep 1
          done

          # Verify key pages return 200
          for path in / /lightning /import /wallets /pl; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${path}")
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: GET ${path} returned ${STATUS}"
              docker logs satsbook-smoke
              exit 1
            fi
            echo "OK: GET ${path} -> ${STATUS}"
          done

          docker rm -f satsbook-smoke
