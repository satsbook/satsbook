name: Test Image

# Manually triggered — builds and pushes a multi-arch Docker image tagged "test"
# to ghcr.io for testing on Umbrel before cutting a release.
#
# Usage:
#   1. Go to Actions → Test Image → Run workflow (pick branch)
#   2. On Umbrel, SSH in and update the image tag:
#        sudo sed -i 's|image: ghcr.io/satsbook/satsbook:.*|image: ghcr.io/satsbook/satsbook:test|' \
#          ~/umbrel/app-data/satsbook-satsbook/docker-compose.yml
#        sudo ~/umbrel/scripts/app restart satsbook-satsbook
#   3. Verify the app works, then cut the real release tag.

on:
  workflow_dispatch:

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & push test image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=test-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test

      - name: Print test instructions
        run: |
          echo "✅ Test image pushed: ghcr.io/satsbook/satsbook:test"
          echo ""
          echo "To test on Umbrel:"
          echo "  1. SSH into your Umbrel"
          echo "  2. Run:"
          echo "     sudo sed -i 's|image: ghcr.io/satsbook/satsbook:.*|image: ghcr.io/satsbook/satsbook:test|' \\"
          echo "       ~/umbrel/app-data/satsbook-satsbook/docker-compose.yml"
          echo "     sudo ~/umbrel/scripts/app restart satsbook-satsbook"
          echo "  3. Check logs: sudo docker logs satsbook-satsbook_server_1 -f"
