{{define "transfer_badge"}}
<div class="transfer-cell" style="display: inline-flex; flex-direction: column; align-items: center; gap: 4px;">
  <span
    hx-post="/api/transactions/transfer"
    hx-vals='{"source_id":"{{.SourceID}}"}'
    hx-target="closest .transfer-cell"
    hx-swap="outerHTML"
    style="cursor: pointer; font-size: 0.75rem; padding: 1px 6px; border-radius: 4px; user-select: none;
      {{if .IsTransfer}}background: #1e3a5f; color: #93c5fd;{{else}}background: transparent; color: var(--text-muted); border: 1px dashed var(--border);{{end}}"
    title="{{if .IsTransfer}}Marked as transfer — click to unmark{{else}}Click to mark as internal transfer{{end}}">
    {{if .IsTransfer}}transfer{{else}}mark{{end}}
  </span>
  {{if not .IsTransfer}}{{if .AmountSat}}
  <span
    hx-get="/api/transactions/transfer/candidates?source_id={{.SourceID}}&amount_sat={{.AmountSat}}&ts={{formatRFC3339 .Time}}"
    hx-target="closest .transfer-cell"
    hx-swap="beforeend"
    hx-trigger="click once"
    style="cursor: pointer; font-size: 0.65rem; color: var(--text-muted); text-decoration: underline;"
    title="Find matching transfer on the other side">find match</span>
  {{end}}{{end}}
</div>
{{end}}
